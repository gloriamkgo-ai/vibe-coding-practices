<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도쿄타워 스탑워치</title>
  <style>
    :root {
      --sky-top: #070b1f;
      --sky-mid: #1b1f4a;
      --sky-low: #5a2d5e;
      --horizon: #c4573a;
      --text: #fdf6ee;
      --muted: rgba(253, 246, 238, 0.62);
      --glass: rgba(12, 14, 36, 0.48);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #ffb347;
      --start: #5ef08a;
      --stop: #ff6b5a;
      --best: #7dffa5;
      --worst: #ff8a7a;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: var(--sky-top);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    /* Night-time Tokyo scene, fixed behind everything */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 78%, var(--horizon) 100%);
    }
    .scene svg {
      position: absolute;
      left: 50%;
      bottom: 0;
      height: 100%;
      width: auto;
      transform: translateX(-50%);
      overflow: visible;
    }
    .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
    .twinkle:nth-child(3n) { animation-delay: -1s; }
    .twinkle:nth-child(3n+1) { animation-delay: -2s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
    .beacon { animation: beacon 1.6s ease-in-out infinite; }
    @keyframes beacon { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .twinkle, .beacon { animation: none; }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 40px 16px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      letter-spacing: 0.18em;
      text-shadow: 0 0 12px rgba(255, 140, 50, 0.6);
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
    }

    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 16vw, 5rem);
      font-weight: 200;
      text-align: center;
      padding: 20px 8px;
      margin-bottom: 28px;
      text-shadow: 0 0 24px rgba(255, 170, 90, 0.45);
    }
    .display .ms { color: var(--muted); }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    button {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid transparent;
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    #secondary {
      background: var(--glass);
      color: var(--text);
      border-color: var(--glass-border);
    }
    #primary {
      background: rgba(30, 90, 50, 0.55);
      color: var(--start);
      border-color: rgba(94, 240, 138, 0.35);
    }
    #primary.running {
      background: rgba(110, 30, 25, 0.55);
      color: var(--stop);
      border-color: rgba(255, 107, 90, 0.35);
    }

    .laps {
      list-style: none;
      margin: 0;
      padding: 0 16px;
    }
    .laps:empty { display: none; }
    .laps li {
      display: flex;
      justify-content: space-between;
      padding: 14px 4px;
      border-bottom: 1px solid var(--glass-border);
      font-variant-numeric: tabular-nums;
    }
    .laps li:last-child { border-bottom: none; }
    .laps li.best { color: var(--best); }
    .laps li.worst { color: var(--worst); }

    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }
    kbd {
      padding: 1px 6px;
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="steel" x1="0" x2="1">
          <stop offset="0" stop-color="#b8361a"/>
          <stop offset="0.5" stop-color="#ff6a2b"/>
          <stop offset="1" stop-color="#b8361a"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff8c3a" stop-opacity="0.45"/>
          <stop offset="1" stop-color="#ff8c3a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff6d8" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
        </radialGradient>
        <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M0 0L10 10M10 0L0 10" stroke="#ffd2a8" stroke-opacity="0.55" stroke-width="0.6"/>
        </pattern>
        <pattern id="city" width="160" height="160" patternUnits="userSpaceOnUse" x="0" y="640">
          <g fill="#15163a">
            <rect x="0" y="40" width="34" height="120"/>
            <rect x="30" y="70" width="40" height="90"/>
            <rect x="68" y="20" width="26" height="140"/>
            <rect x="92" y="60" width="38" height="100"/>
            <rect x="128" y="90" width="32" height="70"/>
          </g>
          <g fill="#ffcf73" opacity="0.45">
            <rect x="8" y="56" width="3" height="3"/><rect x="20" y="80" width="3" height="3"/>
            <rect x="44" y="90" width="3" height="3"/><rect x="76" y="36" width="3" height="3"/>
            <rect x="82" y="70" width="3" height="3"/><rect x="104" y="78" width="3" height="3"/>
            <rect x="140" y="104" width="3" height="3"/>
          </g>
        </pattern>
        <clipPath id="towerClip">
          <path id="towerShape" d="
            M199 30 L201 30 L204 160 L212 160 L212 172 L207 172
            L218 300 L236 300 L236 334 L223 334
            L262 600 L300 762 L262 762
            C 248 690, 222 660, 200 656
            C 178 660, 152 690, 138 762
            L100 762 L138 600 L177 334
            L164 334 L164 300 L182 300 L193 172 L188 172 L188 160 L196 160 Z"/>
        </clipPath>
      </defs>

      <!-- moon and stars -->
      <circle cx="320" cy="110" r="60" fill="url(#moonGlow)"/>
      <circle cx="320" cy="110" r="16" fill="#fff4d6"/>
      <g fill="#ffffff">
        <circle class="twinkle" cx="40" cy="60" r="1.2"/>
        <circle class="twinkle" cx="90" cy="140" r="0.9"/>
        <circle class="twinkle" cx="140" cy="40" r="1.1"/>
        <circle class="twinkle" cx="260" cy="70" r="0.8"/>
        <circle class="twinkle" cx="370" cy="200" r="1"/>
        <circle class="twinkle" cx="60" cy="250" r="0.9"/>
        <circle class="twinkle" cx="350" cy="300" r="0.8"/>
        <circle class="twinkle" cx="25" cy="380" r="1.1"/>
        <circle class="twinkle" cx="240" cy="180" r="0.7"/>
        <circle class="twinkle" cx="120" cy="320" r="0.8"/>
        <circle class="twinkle" cx="300" cy="20" r="1"/>
        <circle class="twinkle" cx="380" cy="420" r="0.9"/>
      </g>

      <!-- warm glow behind the tower -->
      <ellipse cx="200" cy="420" rx="190" ry="360" fill="url(#glow)"/>

      <!-- distant skyline, extends past the viewBox on wide screens -->
      <rect x="-2000" y="640" width="4400" height="160" fill="url(#city)"/>

      <!-- Tokyo Tower -->
      <use href="#towerShape" fill="url(#steel)"/>
      <rect x="0" y="0" width="400" height="800" fill="url(#lattice)" clip-path="url(#towerClip)"/>
      <!-- white bands -->
      <g fill="#fff3e6" clip-path="url(#towerClip)">
        <rect x="0" y="96" width="400" height="10"/>
        <rect x="0" y="226" width="400" height="12"/>
        <rect x="0" y="470" width="400" height="16"/>
        <rect x="0" y="640" width="400" height="14"/>
      </g>
      <!-- observation decks -->
      <rect x="164" y="300" width="72" height="34" rx="3" fill="#2a1a2e"/>
      <g fill="#ffd27a">
        <rect x="168" y="306" width="64" height="5"/>
        <rect x="168" y="318" width="64" height="5"/>
      </g>
      <rect x="188" y="160" width="24" height="12" rx="2" fill="#2a1a2e"/>
      <rect x="191" y="164" width="18" height="3" fill="#ffd27a"/>
      <!-- beacon -->
      <circle class="beacon" cx="200" cy="30" r="4" fill="#ff3b30"/>

      <!-- city skyline -->
      <g fill="#0c0d24">
        <rect x="0" y="690" width="38" height="110"/>
        <rect x="34" y="660" width="30" height="140"/>
        <rect x="62" y="710" width="40" height="90"/>
        <rect x="96" y="740" width="30" height="60"/>
        <rect x="276" y="730" width="34" height="70"/>
        <rect x="306" y="670" width="28" height="130"/>
        <rect x="330" y="700" width="40" height="100"/>
        <rect x="366" y="650" width="34" height="150"/>
        <rect x="-2000" y="762" width="4400" height="400"/>
      </g>
      <g fill="#ffcf73" opacity="0.8">
        <rect x="8" y="704" width="4" height="4"/><rect x="20" y="720" width="4" height="4"/>
        <rect x="42" y="676" width="4" height="4"/><rect x="52" y="700" width="4" height="4"/>
        <rect x="42" y="730" width="4" height="4"/><rect x="74" y="724" width="4" height="4"/>
        <rect x="86" y="748" width="4" height="4"/><rect x="314" y="690" width="4" height="4"/>
        <rect x="322" y="718" width="4" height="4"/><rect x="340" y="716" width="4" height="4"/>
        <rect x="356" y="740" width="4" height="4"/><rect x="376" y="668" width="4" height="4"/>
        <rect x="388" y="700" width="4" height="4"/><rect x="286" y="746" width="4" height="4"/>
      </g>
    </svg>
  </div>

  <main>
    <h1>TOKYO TOWER · 스탑워치</h1>

    <div class="display glass" id="display" aria-live="off">00:00<span class="ms">.00</span></div>

    <div class="controls">
      <button id="secondary" type="button" disabled>랩</button>
      <button id="primary" type="button">시작</button>
    </div>

    <ol class="laps glass" id="laps"></ol>

    <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 재설정</p>
  </main>

  <script>
    const display = document.getElementById("display");
    const primaryBtn = document.getElementById("primary");
    const secondaryBtn = document.getElementById("secondary");
    const lapList = document.getElementById("laps");

    let running = false;
    let startTime = 0;   // performance.now() when the current run started
    let elapsed = 0;     // ms accumulated before the current run
    let lapStart = 0;    // total elapsed time when the current lap began
    let laps = [];       // completed lap durations in ms
    let frame = null;

    function total() {
      return running ? elapsed + (performance.now() - startTime) : elapsed;
    }

    function format(ms) {
      const cs = Math.floor(ms / 10) % 100;
      const s = Math.floor(ms / 1000) % 60;
      const m = Math.floor(ms / 60000) % 60;
      const h = Math.floor(ms / 3600000);
      const pad = (n) => String(n).padStart(2, "0");
      const main = (h > 0 ? h + ":" : "") + pad(m) + ":" + pad(s);
      return { main, cs: "." + pad(cs) };
    }

    function render() {
      const t = format(total());
      display.innerHTML = `${t.main}<span class="ms">${t.cs}</span>`;
      renderCurrentLap();
    }

    function tick() {
      render();
      frame = requestAnimationFrame(tick);
    }

    function renderCurrentLap() {
      const current = lapList.querySelector("li.current");
      if (current) {
        const t = format(total() - lapStart);
        current.lastElementChild.textContent = t.main + t.cs;
      }
    }

    function renderLaps() {
      lapList.innerHTML = "";
      if (!running && elapsed === 0) return;

      const rows = [];
      const t = format(total() - lapStart);
      rows.push(`<li class="current"><span>랩 ${laps.length + 1}</span><span>${t.main}${t.cs}</span></li>`);

      const best = laps.length >= 2 ? Math.min(...laps) : null;
      const worst = laps.length >= 2 ? Math.max(...laps) : null;
      for (let i = laps.length - 1; i >= 0; i--) {
        const f = format(laps[i]);
        const cls = laps[i] === best ? "best" : laps[i] === worst ? "worst" : "";
        rows.push(`<li class="${cls}"><span>랩 ${i + 1}</span><span>${f.main}${f.cs}</span></li>`);
      }
      lapList.innerHTML = rows.join("");
    }

    function updateButtons() {
      primaryBtn.textContent = running ? "정지" : "시작";
      primaryBtn.classList.toggle("running", running);
      secondaryBtn.textContent = running || elapsed === 0 ? "랩" : "재설정";
      secondaryBtn.disabled = !running && elapsed === 0;
    }

    function toggle() {
      if (running) {
        elapsed = total();
        running = false;
        cancelAnimationFrame(frame);
        render();
      } else {
        startTime = performance.now();
        running = true;
        renderLaps();
        tick();
      }
      updateButtons();
    }

    function lap() {
      if (!running) return;
      const now = total();
      laps.push(now - lapStart);
      lapStart = now;
      renderLaps();
    }

    function reset() {
      if (running) return;
      elapsed = 0;
      lapStart = 0;
      laps = [];
      render();
      renderLaps();
      updateButtons();
    }

    primaryBtn.addEventListener("click", toggle);
    secondaryBtn.addEventListener("click", () => (running ? lap() : reset()));

    document.addEventListener("keydown", (e) => {
      if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.code === "Space") {
        e.preventDefault();
        toggle();
      } else if (e.key === "l" || e.key === "L") {
        lap();
      } else if (e.key === "r" || e.key === "R") {
        reset();
      }
    });
  </script>
</body>
</html>
