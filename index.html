<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b1f">
  <title>도쿄타워 스탑워치</title>
  <style>
    :root {
      --sky-top: #070b1f;
      --sky-mid: #1b1f4a;
      --sky-low: #5a2d5e;
      --horizon: #c4573a;
      --bg: var(--sky-top);
      --text: #fdf6ee;
      --muted: rgba(253, 246, 238, 0.82);
      --glass: rgba(10, 12, 32, 0.62);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #ffb347;
      --go: #1fa855;
      --go-text: #ffffff;
      --lap: #ff7a2f;
      --lap-text: #1a0d00;
      --stop: #e5483a;
      --stop-text: #ffffff;
      --neutral: rgba(255, 255, 255, 0.16);
      --neutral-text: #ffffff;
      --best: #7dffa5;
      --worst: #ff9a8c;
      --digit-weight: 300;
    }
    /* Outdoor mode: maximum contrast for direct sunlight */
    :root[data-theme="outdoor"] {
      --bg: #ffffff;
      --text: #000000;
      --muted: #262626;
      --glass: #ffffff;
      --glass-border: #000000;
      --accent: #000000;
      --go: #006b2c;
      --lap: #000000;
      --lap-text: #ffffff;
      --stop: #b3140a;
      --neutral: #e6e6e6;
      --neutral-text: #000000;
      --best: #006b2c;
      --worst: #b3140a;
      --digit-weight: 700;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Night-time Tokyo scene, fixed behind everything */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 78%, var(--horizon) 100%);
    }
    :root[data-theme="outdoor"] .scene { display: none; }
    .scene svg {
      position: absolute;
      left: 50%;
      bottom: 0;
      height: 100%;
      width: auto;
      transform: translateX(-50%);
      overflow: visible;
    }
    .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
    .twinkle:nth-child(3n) { animation-delay: -1s; }
    .twinkle:nth-child(3n+1) { animation-delay: -2s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
    .beacon { animation: beacon 1.6s ease-in-out infinite; }
    @keyframes beacon { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .twinkle, .beacon { animation: none; }
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    @media (max-width: 360px) { h1 { display: none; } }
    h1 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.14em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status[data-state="running"]::before { background: var(--go); box-shadow: 0 0 0 3px rgba(31, 168, 85, 0.35); }
    .status[data-state="paused"]::before { background: var(--accent); border-radius: 2px; }

    .theme-toggle {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .display {
      padding: 14px 8px 12px;
      text-align: center;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 17vw, 5.2rem);
      font-weight: var(--digit-weight);
      line-height: 1.1;
    }
    .time .cs { color: var(--muted); }
    .time.hours { font-size: clamp(2.4rem, 12.5vw, 4.2rem); }
    .display { transition: background-color 0.25s; }
    .display.flash { background: rgba(255, 140, 50, 0.55); transition: none; }
    :root[data-theme="outdoor"] .display.flash { background: #ffe14d; }
    .last-lap {
      margin-top: 6px;
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-height: 1.3em;
    }
    .last-lap small { font-size: 0.6em; font-weight: 700; color: var(--muted); }
    .current-lap {
      margin-top: 2px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-height: 1.4em;
    }

    .record {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .record-head, .laps li {
      display: grid;
      grid-template-columns: 4.6rem minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      padding: 12px 16px;
      font-variant-numeric: tabular-nums;
    }
    .record-head {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid var(--glass-border);
      align-items: center;
    }
    .record-head span:not(:first-child), .laps li span:not(:first-child) { text-align: right; }
    .copy {
      grid-column: 1 / -1;
      justify-self: end;
    }
    .record-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px 6px 16px;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      word-break: keep-all;
      border-bottom: 1px solid var(--glass-border);
    }
    .record-bar button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .record-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .record-bar button:disabled { opacity: 0.55; cursor: default; }
    .laps {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }
    .laps li {
      align-items: start;
      font-size: clamp(0.95rem, 4.4vw, 1.1rem);
      border-bottom: 1px solid var(--glass-border);
    }
    .laps li:last-child { border-bottom: none; }
    .laps li.current { color: var(--muted); }
    .laps li.best { color: var(--best); font-weight: 700; }
    .laps li.worst { color: var(--worst); font-weight: 700; }
    .badge {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 6px;
      border: 1.5px solid currentColor;
      border-radius: 6px;
      font-size: 0.7rem;
      vertical-align: 2px;
    }
    .delta { font-size: 0.8em; font-weight: 600; margin-left: 4px; }
    .laps .delta { display: block; margin-left: 0; }
    .delta.faster { color: var(--best); }
    .delta.slower { color: var(--worst); }
    .empty {
      word-break: keep-all;
      margin: auto;
      padding: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    /* Thumb-zone controls at the bottom of the screen */
    .controls {
      display: flex;
      gap: 20px;
    }
    .controls button {
      min-height: 84px;
      border: none;
      border-radius: 22px;
      font: inherit;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s, filter 0.08s;
    }
    .controls button:active { transform: scale(0.97); filter: brightness(1.15); }
    #side { flex: 1; }
    #main-btn { flex: 2.4; }
    .controls button small {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.85;
    }
    #side[hidden] { display: none; }
    [data-tone="go"] { background: var(--go); color: var(--go-text); }
    [data-tone="lap"] { background: var(--lap); color: var(--lap-text); }
    [data-tone="stop"] { background: var(--stop); color: var(--stop-text); }
    [data-tone="neutral"] { background: var(--neutral); color: var(--neutral-text); border: 2px solid var(--glass-border) !important; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      width: fit-content;
      margin: 0 auto;
      bottom: calc(120px + env(safe-area-inset-bottom));
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 10px 18px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      font-weight: 600;
      word-break: keep-all;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    .toast[hidden] { display: none; }
    .toast button {
      flex-shrink: 0;
      min-height: 40px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: #ffb347;
      color: #000;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .hint {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    @media (pointer: coarse) { .hint { display: none; } }
    kbd {
      padding: 1px 6px;
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="steel" x1="0" x2="1">
          <stop offset="0" stop-color="#b8361a"/>
          <stop offset="0.5" stop-color="#ff6a2b"/>
          <stop offset="1" stop-color="#b8361a"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">

        </radialGradient>
        <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff6d8" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
        </radialGradient>
        <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M0 0L10 10M10 0L0 10" stroke="#ffd2a8" stroke-opacity="0.55" stroke-width="0.6"/>
        </pattern>
        <pattern id="city" width="160" height="160" patternUnits="userSpaceOnUse" x="0" y="640">
          <g fill="#15163a">
            <rect x="0" y="40" width="34" height="120"/>
            <rect x="30" y="70" width="40" height="90"/>
            <rect x="68" y="20" width="26" height="140"/>
            <rect x="92" y="60" width="38" height="100"/>
            <rect x="128" y="90" width="32" height="70"/>
          </g>
          <g fill="#ffcf73" opacity="0.45">
            <rect x="8" y="56" width="3" height="3"/><rect x="20" y="80" width="3" height="3"/>
            <rect x="44" y="90" width="3" height="3"/><rect x="76" y="36" width="3" height="3"/>
            <rect x="82" y="70" width="3" height="3"/><rect x="104" y="78" width="3" height="3"/>
            <rect x="140" y="104" width="3" height="3"/>

            C 178 660, 152 690, 138 762
            L100 762 L138 600 L177 334
            L164 334 L164 300 L182 300 L193 172 L188 172 L188 160 L196 160 Z"/>
        </clipPath>
      </defs>

      <!-- moon and stars -->
      <circle cx="320" cy="110" r="60" fill="url(#moonGlow)"/>
      <circle cx="320" cy="110" r="16" fill="#fff4d6"/>
      <g fill="#ffffff">
        <circle class="twinkle" cx="40" cy="60" r="1.2"/>
        <circle class="twinkle" cx="90" cy="140" r="0.9"/>
        <circle class="twinkle" cx="140" cy="40" r="1.1"/>
        <circle class="twinkle" cx="260" cy="70" r="0.8"/>
        <circle class="twinkle" cx="370" cy="200" r="1"/>
        <circle class="twinkle" cx="60" cy="250" r="0.9"/>
        <circle class="twinkle" cx="350" cy="300" r="0.8"/>
        <circle class="twinkle" cx="25" cy="380" r="1.1"/>
        <circle class="twinkle" cx="240" cy="180" r="0.7"/>
        <circle class="twinkle" cx="120" cy="320" r="0.8"/>
        <circle class="twinkle" cx="300" cy="20" r="1"/>
        <circle class="twinkle" cx="380" cy="420" r="0.9"/>
      </g>

      <!-- warm glow behind the tower -->
      <ellipse cx="200" cy="420" rx="190" ry="360" fill="url(#glow)"/>

      <!-- distant skyline, extends past the viewBox on wide screens -->

      <!-- Tokyo Tower -->
      <use href="#towerShape" fill="url(#steel)"/>

      <!-- white bands -->
      <g fill="#fff3e6" clip-path="url(#towerClip)">
        <rect x="0" y="96" width="400" height="10"/>
        <rect x="0" y="226" width="400" height="12"/>
        <rect x="0" y="470" width="400" height="16"/>
        <rect x="0" y="640" width="400" height="14"/>
      </g>
      <!-- observation decks -->
      <rect x="164" y="300" width="72" height="34" rx="3" fill="#2a1a2e"/>
      <g fill="#ffd27a">
        <rect x="168" y="306" width="64" height="5"/>
        <rect x="168" y="318" width="64" height="5"/>
      </g>
      <rect x="188" y="160" width="24" height="12" rx="2" fill="#2a1a2e"/>
      <rect x="191" y="164" width="18" height="3" fill="#ffd27a"/>
      <!-- beacon -->
      <circle class="beacon" cx="200" cy="30" r="4" fill="#ff3b30"/>

      <!-- city skyline -->
      <g fill="#0c0d24">
        <rect x="0" y="690" width="38" height="110"/>
        <rect x="34" y="660" width="30" height="140"/>
        <rect x="62" y="710" width="40" height="90"/>
        <rect x="96" y="740" width="30" height="60"/>
        <rect x="276" y="730" width="34" height="70"/>
        <rect x="306" y="670" width="28" height="130"/>
        <rect x="330" y="700" width="40" height="100"/>
        <rect x="366" y="650" width="34" height="150"/>
        <rect x="-2000" y="762" width="4400" height="400"/>
      </g>
      <g fill="#ffcf73" opacity="0.8">
        <rect x="8" y="704" width="4" height="4"/><rect x="20" y="720" width="4" height="4"/>
        <rect x="42" y="676" width="4" height="4"/><rect x="52" y="700" width="4" height="4"/>
        <rect x="42" y="730" width="4" height="4"/><rect x="74" y="724" width="4" height="4"/>
        <rect x="86" y="748" width="4" height="4"/><rect x="314" y="690" width="4" height="4"/>
        <rect x="322" y="718" width="4" height="4"/><rect x="340" y="716" width="4" height="4"/>
        <rect x="356" y="740" width="4" height="4"/><rect x="376" y="668" width="4" height="4"/>
        <rect x="388" y="700" width="4" height="4"/><rect x="286" y="746" width="4" height="4"/>
      </g>
    </svg>
  </div>

  <main>
    <header>
      <span class="status glass" id="status" role="status" data-state="idle">대기</span>
      <h1>TOKYO TOWER</h1>
      <button class="theme-toggle glass" id="theme" type="button" aria-pressed="false">☀ 야외 모드</button>
    </header>

    <section class="display glass" aria-label="경과 시간">
      <div class="time" id="time">00:00<span class="cs">.00</span></div>
      <div class="last-lap" id="last-lap" aria-live="polite"></div>
      <div class="current-lap" id="current-lap"></div>
    </section>

    <section class="record glass" aria-label="랩 기록">
      <div class="record-bar">
        <span id="lap-count">랩 기록</span>
        <span class="record-actions">
          <button id="copy" type="button" disabled>복사</button>
          <button id="csv" type="button" disabled>CSV 저장</button>
        </span>
      </div>
      <div class="record-head" aria-hidden="true"><span>랩</span><span>랩 타임</span><span>누적</span></div>
      <ol class="laps" id="laps"></ol>
      <p class="empty" id="empty">측정 중에 <b>랩</b>을 누르면 여기에 기록돼요</p>
    </section>

    <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 재설정</p>

    <div class="controls">
      <button id="side" type="button" hidden></button>
      <button id="main-btn" type="button" data-tone="go">시작</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-msg"></span>
    <button id="toast-action" type="button" hidden>되돌리기</button>
  </div>

  <script>
    const STORE_KEY = "tokyo-stopwatch-v3";
    const $ = (id) => document.getElementById(id);
    const timeEl = $("time");
    const currentLapEl = $("current-lap");
    const lastLapEl = $("last-lap");
    const displayEl = document.querySelector(".display");
    const MIN_LAP_MS = 400; // taps closer than this are treated as an accidental double tap
    const statusEl = $("status");
    const mainBtn = $("main-btn");
    const sideBtn = $("side");
    const lapList = $("laps");
    const emptyEl = $("empty");
    const lapCountEl = $("lap-count");
    const copyBtn = $("copy");
    const csvBtn = $("csv");
    const themeBtn = $("theme");
    const toastEl = $("toast");
    const toastMsg = $("toast-msg");
    const toastAction = $("toast-action");

    // State. Split times are cumulative ms at each lap press.
    let running = false;
    let startTime = 0;   // performance.now() when the current run started
    let sessionStart = 0; // Date.now() when this measurement was first started
    let elapsed = 0;     // ms accumulated before the current run
    let splits = [];
    let frame = null;
    let wakeLock = null;
    let undoState = null;
    let toastTimer = null;

    function total() {
      return running ? elapsed + (performance.now() - startTime) : elapsed;
    }

    // Recorded times are rounded up to the next 1/100 s (athletics rule);
    // the running display truncates so it never shows a time not yet reached.
    const recordCs = (ms) => Math.ceil(Math.round(ms * 1000) / 10000);
    const liveCs = (ms) => Math.floor(ms / 10);
    const pad = (n) => String(n).padStart(2, "0");

    // Main display: fixed-width mm:ss.cc (h:mm:ss.cc past an hour)
    function clockParts(cs) {
      const h = Math.floor(cs / 360000);
      const m = Math.floor(cs / 6000) % 60;
      const s = Math.floor(cs / 100) % 60;
      return { main: (h ? h + ":" : "") + pad(m) + ":" + pad(s), cs: "." + pad(cs % 100) };
    }

    // Athletics notation: 12.34 / 1:05.32 / 1:02:03.45
    function mark(cs) {
      const h = Math.floor(cs / 360000);
      const m = Math.floor(cs / 6000) % 60;
      const s = Math.floor(cs / 100) % 60;
      const frac = "." + pad(cs % 100);
      if (h) return `${h}:${pad(m)}:${pad(s)}${frac}`;
      if (m) return `${m}:${pad(s)}${frac}`;
      return `${s}${frac}`;
    }

    const splitCs = () => splits.map(recordCs);
    function lapCs() {
      const sc = splitCs();
      return sc.map((v, i) => v - (i ? sc[i - 1] : 0));
    }
    const displayCs = () => (running ? liveCs(total()) : recordCs(total()));

    function deltaHtml(cur, prev) {
      if (prev === undefined) return "";
      const d = cur - prev;
      if (d === 0) return `<span class="delta">±0.00</span>`;
      const cls = d < 0 ? "faster" : "slower";
      const word = d < 0 ? "빠름" : "느림";
      return `<span class="delta ${cls}" aria-label="직전보다 ${mark(Math.abs(d))}초 ${word}">${d < 0 ? "−" : "+"}${mark(Math.abs(d))}</span>`;
    }

    function renderLastLap() {
      const laps = lapCs();
      if (!laps.length) { lastLapEl.innerHTML = ""; return; }
      const n = laps.length;
      lastLapEl.innerHTML = `<small>직전 랩 ${n}</small> ${mark(laps[n - 1])}${deltaHtml(laps[n - 1], laps[n - 2])}`;
    }

    function renderTime() {
      const cs = displayCs();
      const p = clockParts(cs);
      timeEl.innerHTML = `${p.main}<span class="cs">${p.cs}</span>`;
      timeEl.classList.toggle("hours", cs >= 360000);
      if (running || splits.length) {
        const sc = splitCs();
        const last = sc.length ? sc[sc.length - 1] : 0;
        const state = running ? "진행 중" : "정지됨";
        currentLapEl.textContent = `랩 ${splits.length + 1} ${state} · ${mark(Math.max(0, cs - last))}`;
      } else {
        currentLapEl.textContent = "";
      }
    }

    function tick() {
      renderTime();
      frame = requestAnimationFrame(tick);
    }

    function renderLaps() {
      const laps = lapCs();
      const sc = splitCs();
      const rows = [];
      let best = null, worst = null;
      if (laps.length >= 2) {
        const min = Math.min(...laps), max = Math.max(...laps);
        if (min !== max) { best = laps.indexOf(min); worst = laps.indexOf(max); }
      }
      // While paused, show the unfinished segment so the table adds up to the total
      const tail = pausedTail();
      if (tail) {
        rows.push(`<li class="current" aria-label="랩 ${laps.length + 1} 정지됨, ${mark(tail.lap)}, 누적 ${mark(tail.split)}"><span>${laps.length + 1}<span class="badge">정지</span></span><span>${mark(tail.lap)}</span><span>${mark(tail.split)}</span></li>`);
      }
      for (let i = laps.length - 1; i >= 0; i--) {
        const cls = i === best ? "best" : i === worst ? "worst" : "";
        const tag = i === best ? "빠름" : i === worst ? "느림" : "";
        const badge = tag ? `<span class="badge">${tag}</span>` : "";
        rows.push(`<li class="${cls}" aria-label="랩 ${i + 1}${tag ? " " + tag : ""}, 랩 타임 ${mark(laps[i])}, 누적 ${mark(sc[i])}"><span>${i + 1}${badge}</span><span>${mark(laps[i])}${deltaHtml(laps[i], laps[i - 1])}</span><span>${mark(sc[i])}</span></li>`);
      }
      lapList.innerHTML = rows.join("");
      emptyEl.hidden = laps.length > 0;
      lapCountEl.textContent = laps.length
        ? `랩 ${laps.length}개 · 평균 ${mark(Math.round(laps.reduce((a, b) => a + b, 0) / laps.length))}`
        : "랩 기록";
      renderLastLap();
      copyBtn.disabled = csvBtn.disabled = !running && elapsed === 0;
    }

    function pausedTail() {
      if (running || !splits.length) return null;
      const sc = splitCs();
      const split = recordCs(elapsed);
      const lap = split - sc[sc.length - 1];
      return lap > 0 ? { lap, split } : null;
    }

    function setButton(btn, label, tone, sub) {
      btn.innerHTML = sub ? `${label}<small>${sub}</small>` : label;
      btn.dataset.tone = tone;
    }

    function renderControls() {
      const idle = !running && elapsed === 0;
      if (running) {
        setButton(mainBtn, "랩", "lap", "구간 기록");
        setButton(sideBtn, "정지", "stop", "시간 멈춤");
        statusEl.textContent = "측정 중";
        statusEl.dataset.state = "running";
      } else if (idle) {
        setButton(mainBtn, "시작", "go");
        statusEl.textContent = "대기";
        statusEl.dataset.state = "idle";
      } else {
        setButton(mainBtn, "계속", "go", "이어서 측정");
        setButton(sideBtn, "재설정", "neutral", "기록 지움");
        statusEl.textContent = "일시정지";
        statusEl.dataset.state = "paused";
      }
      sideBtn.hidden = idle;
    }

    function renderAll() {
      renderTime();
      renderLaps();
      renderControls();
    }

    // While the page is open, timing uses the monotonic performance.now(), so
    // device clock changes have no effect. Only a reload needs wall-clock time:
    // we checkpoint every second and, on reload, add just the gap since the last
    // checkpoint. A clock change can therefore only affect that short gap.
    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          running, splits, sessionStart,
          elapsed: total(),
          wall: Date.now(),
          theme: document.documentElement.dataset.theme || "",
        }));
      } catch (_) { /* storage unavailable: state just won't survive reload */ }
    }

    function restore() {
      let s;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (_) { s = null; }
      if (!s) return;
      if (s.theme) setTheme(s.theme);
      elapsed = Number(s.elapsed) || 0;
      sessionStart = Number(s.sessionStart) || 0;
      splits = Array.isArray(s.splits) ? s.splits.map(Number) : [];
      if (s.running) {
        const wall = Number(s.wall) || Date.now();
        let gap = Date.now() - wall;
        if (gap < 0) {
          // Device clock moved backwards while the page was closed
          gap = 0;
          showToast("기기 시계가 바뀌어 새로고침하는 동안의 시간은 빠졌을 수 있어요", false);
        }
        elapsed += gap;
        startTime = performance.now();
        running = true;
        requestWakeLock();
        tick();
      }
    }

    function buzz(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) { wakeLock = null; }
    }
    function releaseWakeLock() {
      if (wakeLock) wakeLock.release().catch(() => {});
      wakeLock = null;
    }

    function start() {
      if (running) return;
      startTime = performance.now();
      if (elapsed === 0) sessionStart = Date.now();
      running = true;
      hideToast();
      tick();
      requestWakeLock();
      buzz(40);
      renderAll();
      save();
    }

    function stop() {
      if (!running) return;
      undoState = { type: "stop", elapsed, startTime };
      elapsed = total();
      running = false;
      cancelAnimationFrame(frame);
      releaseWakeLock();
      buzz([40, 60, 40]);
      renderAll();
      save();
      showToast("시간을 멈췄어요", true);
    }

    function lap() {
      if (!running) return;
      const now = total();
      // Ignore a second tap that lands within the same 1/100 s as the previous split
      if (splits.length && now - splits[splits.length - 1] < MIN_LAP_MS) return;
      if (!splits.length && now < MIN_LAP_MS) return;
      splits.push(now);
      buzz(25);
      flash();
      renderLaps();
      lapList.scrollTop = 0;
      save();
    }

    function reset() {
      if (running || (elapsed === 0 && !splits.length)) return;
      undoState = { type: "reset", elapsed, splits: splits.slice(), sessionStart };
      elapsed = 0;
      sessionStart = 0;
      splits = [];
      renderAll();
      save();
      showToast("기록을 지웠어요", true);
    }

    function flash() {
      displayEl.classList.add("flash");
      setTimeout(() => displayEl.classList.remove("flash"), 180);
    }

    function undo() {
      if (!undoState || running) return;
      const u = undoState;
      undoState = null;
      hideToast();
      if (u.type === "stop") {
        // Resume as if stop was never pressed: the clock keeps the original start
        elapsed = u.elapsed;
        startTime = u.startTime;
        running = true;
        tick();
        requestWakeLock();
      } else {
        elapsed = u.elapsed;
        splits = u.splits;
        sessionStart = u.sessionStart;
      }
      renderAll();
      save();
    }

    function showToast(msg, withUndo) {
      toastMsg.textContent = msg;
      toastAction.hidden = !withUndo;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, withUndo ? 6000 : 2000);
    }
    function hideToast() {
      toastEl.hidden = true;
      if (toastAction.hidden === false) undoState = null;
    }

    function setTheme(theme) {
      const outdoor = theme === "outdoor";
      if (outdoor) document.documentElement.dataset.theme = "outdoor";
      else delete document.documentElement.dataset.theme;
      themeBtn.setAttribute("aria-pressed", String(outdoor));
      themeBtn.textContent = outdoor ? "☾ 야경 모드" : "☀ 야외 모드";
      document.querySelector('meta[name="theme-color"]').content = outdoor ? "#ffffff" : "#070b1f";
    }

    function sessionDate() {
      const d = new Date(sessionStart || Date.now());
      return {
        stamp: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
        file: `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`,
      };
    }

    // One row per lap (plus the unfinished segment while paused), in centiseconds
    function recordRows() {
      const laps = lapCs();
      const sc = splitCs();
      const rows = laps.map((l, i) => ({ label: String(i + 1), lap: l, split: sc[i] }));
      const tail = pausedTail();
      if (tail) rows.push({ label: `${laps.length + 1}(정지)`, lap: tail.lap, split: tail.split });
      return rows;
    }

    function recordSummary() {
      const laps = lapCs();
      return {
        total: recordCs(total()),
        avg: laps.length ? Math.round(laps.reduce((a, b) => a + b, 0) / laps.length) : null,
      };
    }

    function recordText() {
      const { total: t, avg } = recordSummary();
      const lines = [`측정 ${sessionDate().stamp}`, `총 기록 ${mark(t)}${running ? " (측정 중)" : ""}`];
      if (avg !== null) lines.push(`평균 랩 ${mark(avg)}`);
      lines.push("랩\t랩 타임\t누적");
      recordRows().forEach((r) => lines.push(`${r.label}\t${mark(r.lap)}\t${mark(r.split)}`));
      return lines.join("\n");
    }

    // CSV keeps the athletics notation for reading and plain seconds for calculating
    function recordCsv() {
      const { total: t, avg } = recordSummary();
      const sec = (cs) => (cs / 100).toFixed(2);
      const lines = [
        `측정 일시,${sessionDate().stamp}`,
        `총 기록,${mark(t)},${sec(t)}${running ? ",측정 중" : ""}`,
      ];
      if (avg !== null) lines.push(`평균 랩,${mark(avg)},${sec(avg)}`);
      lines.push("", "랩,랩 타임,누적,랩 타임(초),누적(초)");
      recordRows().forEach((r) => lines.push(`${r.label},${mark(r.lap)},${mark(r.split)},${sec(r.lap)},${sec(r.split)}`));
      return lines.join("\r\n");
    }

    function downloadCsv() {
      // BOM so Excel opens Korean text as UTF-8
      const blob = new Blob(["\uFEFF" + recordCsv()], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `stopwatch-${sessionDate().file}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showToast("CSV 파일을 저장했어요", false);
    }

    async function copyRecord() {
      const text = recordText();
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      showToast("기록을 복사했어요", false);
    }

    mainBtn.addEventListener("click", () => (running ? lap() : start()));
    sideBtn.addEventListener("click", () => (running ? stop() : reset()));
    toastAction.addEventListener("click", undo);
    copyBtn.addEventListener("click", copyRecord);
    csvBtn.addEventListener("click", downloadCsv);
    setInterval(() => { if (running) save(); }, 1000);
    window.addEventListener("pagehide", save);
    themeBtn.addEventListener("click", () => {
      setTheme(document.documentElement.dataset.theme === "outdoor" ? "" : "outdoor");
      save();
    });

    document.addEventListener("keydown", (e) => {
      if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      // e.code is layout-independent, so shortcuts also work with a Korean IME
      if (e.code === "Space") {
        e.preventDefault();
        running ? stop() : start();
      } else if (e.code === "KeyL") {
        lap();
      } else if (e.code === "KeyR") {
        reset();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (running && document.visibilityState === "visible") requestWakeLock();
    });

    restore();
    renderAll();
  </script>
</body>
</html>
